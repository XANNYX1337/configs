<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFG Workshop — конфиги</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">Hot Workshop Configs <span class="logo-sub">For Neverfair</span></div>
  <div class="topbar-actions">
    <span id="conn-status" class="conn-status"></span>
    <button id="btn-refresh" class="btn ghost">Обновить</button>
  </div>
</header>

<main class="container">

  <section class="card">
    <div class="list-head">
      <h2>Конфиги</h2>
      <span id="file-count" class="muted"></span>
    </div>
    <p class="hint">Файлы подтягиваются автоматически из папки <code>configs</code> в репозитории. Новые конфиги появляются после нажатия «Обновить».</p>
    <div id="file-list" class="file-list"></div>
    <div id="empty-state" class="empty-state hidden"></div>
  </section>

</main>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=6"></script>
</body>
</html>

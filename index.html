<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Workshop Configs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<div class="bg-glow"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">Hot Workshop <span>Configs</span></div>
    <div class="logo-sub">For Neverfair</div>
  </div>
  <div class="topbar-actions">
    <span id="conn-status" class="conn-status"></span>
    <button id="btn-refresh" class="btn ghost" title="Обновить список">⟳</button>
  </div>
</header>

<main class="container">

  <section class="card list-section">
    <div class="list-head">
      <h2>Конфиги</h2>
      <span id="file-count" class="muted"></span>
    </div>
    <div class="search-row">
      <input type="search" id="search-input" class="text-input" placeholder="Поиск по названию...">
    </div>
    <div id="file-list" class="file-list"></div>
    <div id="empty-state" class="empty-state hidden"></div>
  </section>

  <footer class="footer">
    <span>Hot Workshop Configs</span>
    <span class="dot">·</span>
    <span>For Neverfair</span>
  </footer>

</main>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=7"></script>
</body>
</html>

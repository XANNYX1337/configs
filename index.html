<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Workshop Configs</title>
<link href="https://fonts.googleapis.com/css?family=Raleway:400,900" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<header class="p-header">
  <div class="p-header-inner">
    <a class="logo">Hot Workshop <span>Configs</span></a>
    <div class="p-nav-opposite">
      <span id="conn-status" class="conn-status"></span>
      <button class="nav-btn primary" id="btn-refresh">Обновить</button>
    </div>
  </div>
</header>

<div class="gs-divider"></div>

<div class="p-body">

  <div class="p-title">
    <h1 class="p-title-value">For Neverfair</h1>
    <div class="p-title-pageAction">
      <span class="button" id="file-count">0 файлов</span>
    </div>
  </div>

  <div class="block">
    <div class="block-header">Хранилище конфигов</div>
    <div class="block-container">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="Поиск по названию...">
      </div>
      <div id="file-list"></div>
      <div id="empty-state" class="empty hidden"></div>
    </div>
  </div>

  <div class="footer">
    Hot Workshop Configs · For Neverfair · Не размещайте файлы, нарушающие правила
  </div>

</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=8"></script>
</body>
</html>
